name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html styles.css src _site/
      # Browsers cache Pages files for up to 10 minutes. Stamping each deploy's commit
      # onto the stylesheet, the app script and every module import makes them fetch
      # the new files as soon as the page itself is fresh.
      - name: Stamp file versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#href=\"styles\.css\"#href=\"styles.css?v=$V\"#; s#src=\"src/app\.js\"#src=\"src/app.js?v=$V\"#" _site/index.html
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" _site/src/*.js
          grep -q "app.js?v=$V" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
