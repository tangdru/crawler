<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reference Crawler</title>
<meta name="description" content="Watch a crawler read any document or web page: references, trends and tone, with summary charts and CSV export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">Reference Crawler</div>
  <div class="ctl">
    <button id="openBtn" class="primary" type="button">Open…</button>
    <div class="seg" role="radiogroup" aria-label="Lens">
      <button type="button" role="radio" data-lens="references" aria-checked="true">References</button>
      <button type="button" role="radio" data-lens="trends" aria-checked="false">Trends</button>
      <button type="button" role="radio" data-lens="tone" aria-checked="false">Tone</button>
    </div>
  </div>
  <div class="ctl">
    <button id="play" type="button">Pause</button>
    <select id="speed" aria-label="Reading speed">
      <option value="0.5">0.5×</option><option value="1">1×</option><option value="2" selected>2×</option>
      <option value="4">4×</option><option value="8">8×</option><option value="16">16×</option>
    </select>
    <button id="skip" type="button" title="Apply this lens to the whole document now">Finish now</button>
    <div class="seg" role="tablist" aria-label="View">
      <button type="button" role="tab" data-view="doc" aria-selected="true">Document</button>
      <button type="button" role="tab" data-view="summary" aria-selected="false">Summary</button>
    </div>
    <div class="menu">
      <button id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false">Export CSV</button>
      <div class="menu-list" id="exportMenu" hidden>
        <button type="button" data-export="entities">entities.csv <span>every reference found</span></button>
        <button type="button" data-export="sentences">sentences.csv <span>one row per sentence</span></button>
        <button type="button" data-export="terms">terms.csv <span>needs a Trends crawl</span></button>
        <button type="button" data-export="zip">All as .zip</button>
      </div>
    </div>
  </div>
</header>

<canvas id="fx" aria-hidden="true"></canvas>

<main id="docView">
  <div class="docmeta" id="docMeta"></div>
  <article id="doc"></article>
</main>

<section id="summaryView" class="summary" hidden></section>

<footer class="hud" id="hud">
  <div class="prog"><i id="progBar"></i></div>
  <div class="row" id="hudStats"></div>
  <div class="row"><span class="last" id="hudLine">Loading…</span></div>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle">Open something to crawl</h3>
      <button type="button" id="closeSheet" class="ghost" aria-label="Close">Close</button>
    </div>
    <form id="urlForm" class="src">
      <label for="urlIn">Web address</label>
      <div class="inline">
        <input id="urlIn" type="text" inputmode="url" placeholder="https://en.wikipedia.org/wiki/Spider" autocomplete="off">
        <button type="submit" class="primary">Load page</button>
      </div>
      <p class="hint">Articles, papers, Wikipedia, blogs and PDFs at a link. Pages behind a login won't load; copy their text and paste it below.</p>
    </form>
    <div class="src">
      <label for="fileIn">File</label>
      <label class="drop" id="drop" for="fileIn">
        <input id="fileIn" type="file" accept=".pdf,.docx,.xlsx,.xls,.ods,.csv,.tsv,.pptx,.odt,.odp,.epub,.rtf,.html,.htm,.md,.markdown,.txt,.json,text/*">
        <b>Drop a file here</b> or click to choose one
        <span class="hint">PDF, Word, Excel, PowerPoint, EPUB, OpenDocument, HTML, Markdown, text, CSV, JSON, RTF</span>
      </label>
    </div>
    <form id="pasteForm" class="src">
      <label for="pasteIn">Paste text</label>
      <textarea id="pasteIn" placeholder="Paste an article, a reference list, notes… or a web address."></textarea>
      <div class="inline end"><button type="submit" class="primary">Crawl this text</button></div>
    </form>
    <div class="src">
      <span class="lab">Samples</span>
      <div class="inline">
        <button type="button" data-sample="references">Reference list</button>
        <button type="button" data-sample="article">News article</button>
      </div>
    </div>
    <p class="error" id="sheetError" role="alert" hidden></p>
  </div>
</div>

<div class="busy" id="busy" hidden><div><span class="spin" aria-hidden="true"></span><span id="busyText">Loading…</span></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
